[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laserlab-toolkit"
dynamic = ["version"]
description = "LaserLab toolkit: diode chains (Maiman/Aerodiode), APG1780DA, dual EOM and Spectrum AWG with a plugin registry for building custom PyQt6 GUIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Stock" }]
dependencies = [
    "PyQt6>=6.5,<7",
    "pyserial>=3.5,<4",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "tomli>=2; python_version < \"3.11\"",
    "maiman-drivers[gui] @ git+https://github.com/AGKarpf/Maiman-Treiber-Software.git",
    "aerodiode-driver[gui] @ git+https://github.com/AGKarpf/Aerodiode-Treiber-Software.git",
    "apg1780da[gui] @ git+https://github.com/AGKarpf/apg1780da.git",
    "eom-controller[gui] @ git+https://github.com/AGKarpf/EOM-Controller.git",
    "spectrum-awg @ git+https://github.com/AGKarpf/spectrum_m4i_awg.git",
]

[project.optional-dependencies]
# Spectrum card driver binding (needs the native SPCM drivers installed).
hardware = ["spcm_core"]
test = ["pytest>=7"]

[project.gui-scripts]
laserlab = "laserlab.__main__:main"

[tool.setuptools]
packages = ["laserlab", "laserlab.srp"]

[tool.setuptools.package-data]
"laserlab.srp" = ["defaults/*.toml", "defaults/*.ini"]

[tool.setuptools.dynamic]
version = { attr = "laserlab.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
